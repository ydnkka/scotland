<line x1="86" y1="301" x2="466" y2="301" class="axis"/>
<line x1="219.0" y1="216" x2="219.0" y2="301" stroke="#d14d41" stroke-width="2.5"/>
<text x="219" y="212" text-anchor="middle" class="observed">observed</text>
<text x="86" y="321" text-anchor="start" class="tiny">smaller distance</text>
<text x="466" y="321" text-anchor="end" class="tiny">larger distance</text>
<text x="496" y="247" text-anchor="start" class="q">q = 0.35</text>
<text x="496" y="271" text-anchor="start" class="tiny">empirical percentile</text>
<text x="86" y="356" text-anchor="start" class="panel-title">Genetic distance</text>
<path d="M 86,470 L 86.0,468.6 L 90.7,468.3 L 95.4,467.9 L 100.2,467.5 L 104.9,467.0 L 109.6,466.5 L 114.3,465.8 L 119.0,465.1 L 123.7,464.3 L 128.5,463.4 L 133.2,462.3 L 137.9,461.1 L 142.6,459.8 L 147.3,458.4 L 152.0,456.8 L 156.8,455.1 L 161.5,453.3 L 166.2,451.3 L 170.9,449.1 L 175.6,446.8 L 180.3,444.4 L 185.1,441.9 L 189.8,439.3 L 194.5,436.6 L 199.2,433.8 L 203.9,431.0 L 208.6,428.1 L 213.4,425.3 L 218.1,422.5 L 222.8,419.7 L 227.5,417.1 L 232.2,414.6 L 237.0,412.2 L 241.7,410.0 L 246.4,408.1 L 251.1,406.4 L 255.8,404.9 L 260.5,403.7 L 265.3,402.8 L 270.0,402.3 L 274.7,402.0 L 279.4,402.1 L 284.1,402.5 L 288.8,403.2 L 293.6,404.2 L 298.3,405.5 L 303.0,407.1 L 307.7,408.9 L 312.4,411.0 L 317.1,413.3 L 321.9,415.7 L 326.6,418.3 L 331.3,421.0 L 336.0,423.7 L 340.7,426.5 L 345.4,429.4 L 350.2,432.2 L 354.9,435.0 L 359.6,437.8 L 359.6,470 Z" fill="#7c3aed" opacity="0.28"/>
<path d="M 86.0,468.6 L 90.8,468.3 L 95.5,467.9 L 100.2,467.5 L 105.0,467.0 L 109.8,466.5 L 114.5,465.8 L 119.2,465.1 L 124.0,464.2 L 128.8,463.3 L 133.5,462.2 L 138.2,461.1 L 143.0,459.7 L 147.8,458.3 L 152.5,456.7 L 157.2,454.9 L 162.0,453.0 L 166.8,451.0 L 171.5,448.8 L 176.2,446.5 L 181.0,444.1 L 185.8,441.5 L 190.5,438.9 L 195.2,436.1 L 200.0,433.3 L 204.8,430.5 L 209.5,427.6 L 214.2,424.8 L 219.0,421.9 L 223.8,419.2 L 228.5,416.6 L 233.2,414.1 L 238.0,411.7 L 242.8,409.6 L 247.5,407.7 L 252.2,406.0 L 257.0,404.6 L 261.8,403.5 L 266.5,402.7 L 271.2,402.2 L 276.0,402.0 L 280.8,402.2 L 285.5,402.7 L 290.2,403.5 L 295.0,404.6 L 299.8,406.0 L 304.5,407.7 L 309.2,409.6 L 314.0,411.7 L 318.8,414.1 L 323.5,416.6 L 328.2,419.2 L 333.0,421.9 L 337.8,424.8 L 342.5,427.6 L 347.2,430.5 L 352.0,433.3 L 356.8,436.1 L 361.5,438.9 L 366.2,441.5 L 371.0,444.1 L 375.8,446.5 L 380.5,448.8 L 385.2,451.0 L 390.0,453.0 L 394.8,454.9 L 399.5,456.7 L 404.2,458.3 L 409.0,459.7 L 413.8,461.1 L 418.5,462.2 L 423.2,463.3 L 428.0,464.2 L 432.8,465.1 L 437.5,465.8 L 442.2,466.5 L 447.0,467.0 L 451.8,467.5 L 456.5,467.9 L 461.2,468.3 L 466.0,468.6" fill="none" stroke="#5b6b7c" stroke-width="2"/>
<line x1="86" y1="470" x2="466" y2="470" class="axis"/>
<line x1="359.6" y1="385" x2="359.6" y2="470" stroke="#7c3aed" stroke-width="2.5"/>
<text x="359.6" y="381" text-anchor="middle" class="observed">observed</text>
<text x="86" y="490" text-anchor="start" class="tiny">smaller distance</text>
<text x="466" y="490" text-anchor="end" class="tiny">larger distance</text>
<text x="496" y="416" text-anchor="start" class="q">q = 0.72</text>
<text x="496" y="440" text-anchor="start" class="tiny">empirical percentile</text>
<rect x="770" y="126" width="368" height="392" rx="10" class="card"/>
<text x="794" y="160" text-anchor="start" class="panel-title">Percentile → compatibility</text>
<text x="954" y="213" text-anchor="middle" class="formula-big">c(q) = 1 − 2|q − 0.5|</text>
<path d="M 824 354 L 954 239 L 1084 354" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<line x1="824" y1="354" x2="1084" y2="354" class="axis"/>
<text x="824" y="376" text-anchor="middle" class="tiny">q = 0</text>
<text x="954" y="376" text-anchor="middle" class="tiny">0.5</text>
<text x="1084" y="376" text-anchor="middle" class="tiny">1</text>
<text x="954" y="231" text-anchor="middle" class="tiny">maximum compatibility</text>
<text x="954" y="417" text-anchor="middle" class="body">Highest near the simulated median;</text>
<text x="954" y="440" text-anchor="middle" class="body">decreasing toward either tail.</text>
<text x="954" y="482" text-anchor="middle" class="observed">q is an empirical percentile.</text>
<text x="42" y="558" text-anchor="start" class="step">2  COMBINE MARGINAL COMPATIBILITIES</text>
<rect x="42" y="578" width="1096" height="160" rx="10" class="card"/>
<line x1="590" y1="598" x2="590" y2="718" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="66" y="611" text-anchor="start" class="panel-title">Within each scenario</text>
<text x="66" y="648" text-anchor="start" class="formula">scenario score = c(q_temporal) × c(q_genetic)</text>
<text x="66" y="693" text-anchor="start" class="body">Multiply the temporal and genetic marginal compatibilities.</text>
<text x="620" y="611" text-anchor="start" class="panel-title">Across configured target scenarios</text>
<text x="620" y="648" text-anchor="start" class="formula-small">target score = score_ad(0) + score_ca(0,0)</text>
<text x="620" y="682" text-anchor="start" class="body">ad(0): direct ancestor–descendant</text>
<text x="620" y="710" text-anchor="start" class="body">ca(0,0): co-primary / common-ancestor</text>
</svg>
