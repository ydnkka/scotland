<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Sliding three-week temporal windows with a one-week step</title>
  <desc id="desc">Five overlapping, half-open three-week windows. Samples are partitioned by Pango lineage and clustered separately within every window.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17202a; }
      .header { font-size: 15px; font-weight: 700; }
      .label { font-size: 15px; }
      .small { font-size: 13px; fill: #475569; }
      .note { font-size: 14px; }
      .window { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

<text x="42" y="38" text-anchor="start" class="header">Rolling-window construction</text>
<text x="42" y="62" text-anchor="start" class="small">Three-week duration · one-week step</text>
<text x="186" y="92" text-anchor="middle" class="header">Week 1</text>
<line x1="150" y1="101" x2="150" y2="374" class="grid"/>
<text x="258" y="92" text-anchor="middle" class="header">Week 2</text>
<line x1="222" y1="101" x2="222" y2="374" class="grid"/>
<text x="330" y="92" text-anchor="middle" class="header">Week 3</text>
<line x1="294" y1="101" x2="294" y2="374" class="grid"/>
<text x="402" y="92" text-anchor="middle" class="header">Week 4</text>
<line x1="366" y1="101" x2="366" y2="374" class="grid"/>
<text x="474" y="92" text-anchor="middle" class="header">Week 5</text>
<line x1="438" y1="101" x2="438" y2="374" class="grid"/>
<text x="546" y="92" text-anchor="middle" class="header">Week 6</text>
<line x1="510" y1="101" x2="510" y2="374" class="grid"/>
<text x="618" y="92" text-anchor="middle" class="header">Week 7</text>
<line x1="582" y1="101" x2="582" y2="374" class="grid"/>
<text x="690" y="92" text-anchor="middle" class="header">Week 8</text>
<line x1="654" y1="101" x2="654" y2="374" class="grid"/>
<text x="762" y="92" text-anchor="middle" class="header">Week 9</text>
<line x1="726" y1="101" x2="726" y2="374" class="grid"/>
<text x="834" y="92" text-anchor="middle" class="header">Week 10</text>
<line x1="798" y1="101" x2="798" y2="374" class="grid"/>
<line x1="870" y1="101" x2="870" y2="374" class="grid"/>
<text x="134" y="142" text-anchor="end" class="label">Window 1</text>
<rect x="150" y="118" width="216" height="38" rx="5" class="window"/>
<text x="258" y="143" text-anchor="middle" class="label">Weeks 1–3</text>
<text x="134" y="198" text-anchor="end" class="label">Window 2</text>
<rect x="222" y="174" width="216" height="38" rx="5" class="window"/>
<text x="330" y="199" text-anchor="middle" class="label">Weeks 2–4</text>
<text x="134" y="254" text-anchor="end" class="label">Window 3</text>
<rect x="294" y="230" width="216" height="38" rx="5" class="window"/>
<text x="402" y="255" text-anchor="middle" class="label">Weeks 3–5</text>
<text x="134" y="310" text-anchor="end" class="label">Window 4</text>
<rect x="366" y="286" width="216" height="38" rx="5" class="window"/>
<text x="474" y="311" text-anchor="middle" class="label">Weeks 4–6</text>
<text x="134" y="366" text-anchor="end" class="label">Window 5</text>
<rect x="438" y="342" width="216" height="38" rx="5" class="window"/>
<text x="546" y="367" text-anchor="middle" class="label">Weeks 5–7</text>
<line x1="150" y1="389" x2="222" y2="389" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150" y="411" text-anchor="start" class="small">one-week step</text>
<rect x="42" y="432" width="916" height="47" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="58" y="452" text-anchor="start" class="header">Membership rule:</text>
<text x="184" y="452" text-anchor="start" class="note">start ≤ collection_date &lt; end (half-open interval)</text>
<text x="58" y="470" text-anchor="start" class="small">A sequence may occur in up to three overlapping windows; clustering is performed separately by Pango lineage within each window.</text>
</svg>
